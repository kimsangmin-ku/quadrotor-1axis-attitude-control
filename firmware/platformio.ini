; quadrotor-1axis-attitude-control / firmware
; 개인 소유 Nucleo-F446RE 전용 프로젝트. 수업(LPC1768) 프로젝트와 폴더·툴체인 모두 별개.

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = mbed
; 업로드: ST-LINK 드라이버 없이도 되는 mbed 방식(NODE_F446RE 드라이브에 .bin 복사). 디버거 쓰려면 stlink로 바꾸고 ST-LINK 드라이버 설치.
upload_protocol = mbed
monitor_speed = 115200
build_flags =
    -D MBED_CONF_PLATFORM_STDIO_BAUD_RATE=115200
